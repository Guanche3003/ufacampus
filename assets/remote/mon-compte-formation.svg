<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 188" role="img" aria-label="Mon Compte Formation - CPF">
  <rect width="300" height="188" fill="#ffffff"/>
  <!-- MON : bloc plein, aligné à gauche -->
  <rect x="8" y="10" width="150" height="52" fill="#21409A"/>
  <text x="83" y="47" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="1">MON</text>
  <!-- COMPTE : bloc plein, décalé à droite, le plus large -->
  <rect x="56" y="68" width="236" height="52" fill="#21409A"/>
  <text x="174" y="105" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="1">COMPTE</text>
  <!-- FORMATION : bloc contour, fond blanc, texte bleu -->
  <rect x="8" y="126" width="270" height="52" fill="#ffffff" stroke="#21409A" stroke-width="6"/>
  <text x="143" y="163" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#21409A" letter-spacing="1">FORMATION</text>
</svg>
